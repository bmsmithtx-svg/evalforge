[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge-sdk"
version = "0.1.0"
description = "EvalForge Python SDK — run, trace, and artifact ingestion client (Milestone 5)."
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_sdk"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=evalforge_sdk --cov-report=term-missing"

[tool.coverage.run]
source = ["src/evalforge_sdk"]

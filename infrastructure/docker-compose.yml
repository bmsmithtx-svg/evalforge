# Local development stack only. Credentials below are synthetic,
# local-only defaults — never used outside a developer's machine and
# never valid against any real environment.
name: evalforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge-local-dev
      POSTGRES_DB: evalforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalforge -d evalforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: evalforge-local-dev
      MINIO_ROOT_PASSWORD: evalforge-local-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage-init:
    image: minio/mc:latest
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 evalforge-local-dev evalforge-local-dev-secret &&
      mc mb --ignore-existing local/evalforge-local
      "
    restart: "no"

  api:
    build:
      context: ../services/api
    environment:
      EVALFORGE_ENVIRONMENT: local
      EVALFORGE_LOG_LEVEL: INFO
      EVALFORGE_DATABASE_URL: postgresql://evalforge:evalforge-local-dev@postgres:5432/evalforge
      EVALFORGE_REDIS_URL: redis://redis:6379/0
      EVALFORGE_OBJECT_STORAGE_ENDPOINT_URL: http://object-storage:9000
      EVALFORGE_OBJECT_STORAGE_ACCESS_KEY: evalforge-local-dev
      EVALFORGE_OBJECT_STORAGE_SECRET_KEY: evalforge-local-dev-secret
      EVALFORGE_OBJECT_STORAGE_BUCKET: evalforge-local
      EVALFORGE_OBJECT_STORAGE_USE_TLS: "false"
      EVALFORGE_CORS_ALLOWED_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../apps/web
      args:
        API_BASE_URL: http://api:8000
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  object-storage-data:

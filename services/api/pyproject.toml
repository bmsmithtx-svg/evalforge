[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge-api"
version = "0.2.0"
description = "EvalForge control/API service — Milestone 2 engineering foundation."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "structlog>=24.4,<25.0",
  "asyncpg>=0.30,<1.0",
  "redis>=5.2,<6.0",
  "boto3>=1.35,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.7,<1.0",
  "mypy>=1.13,<2.0",
  "boto3-stubs[s3]>=1.35,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalforge_api"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=evalforge_api --cov-report=term-missing"

[tool.coverage.run]
source = ["src/evalforge_api"]
